{% extends 'base.html' %}

{% block content %}
<section class="panel">
  <div class="section-header">
    <h1>Portfolio Price Chart</h1>
  </div>

  <form class="stock-selector" method="get" action="/">
    {% for index in range(1, 4) %}
    <label>
      Stock {{ index }}
      <select name="stock_{{ index }}">
        <option value="">-- Select a stock --</option>
        {% for ticker in all_tickers %}
        <option value="{{ ticker }}" {% if selected_tickers[index - 1] == ticker %}selected{% endif %}>{{ ticker }}</option>
        {% endfor %}
      </select>
    </label>
    {% endfor %}
    <button type="submit">Update Portfolio</button>
  </form>

  <div class="portfolio-summary">
    <strong>Selected Stocks:</strong>
    {% if selected_tickers %}
      {{ selected_tickers | join(', ') }}
    {% else %}
      MSFT
    {% endif %}
    <span class="portfolio-return">Total Portfolio Return: {{ summary.portfolio_return }}%</span>
  </div>

  <canvas id="priceChart" height="90"></canvas>
</section>

<script>
  const chartData = {{ chart_data | tojson }};
  const buyPoints = {{ buy_points | tojson }};
  const sellPoints = {{ sell_points | tojson }};
  const selectedTickers = {{ selected_tickers | tojson }};

  const labels = chartData.map(row => row.Date);
  const colors = ['#2563eb', '#10b981', '#f59e0b'];

  const datasets = selectedTickers.map((ticker, index) => ({
    label: ticker,
    data: chartData.map(row => row[ticker] ?? null),
    borderColor: colors[index % colors.length],
    backgroundColor: 'rgba(0,0,0,0)',
    borderWidth: 2,
    pointRadius: 0,
    fill: false
  }));

  const buyMap = new Map(buyPoints.map(point => [point.date + ':' + point.ticker, point.price]));
  const sellMap = new Map(sellPoints.map(point => [point.date + ':' + point.ticker, point.price]));

  const buySignals = [];
  const sellSignals = [];

  selectedTickers.forEach((ticker, tickerIndex) => {
    const tickerColor = colors[tickerIndex % colors.length];
    chartData.forEach((row) => {
      const buyKey = row.Date + ':' + ticker;
      const sellKey = row.Date + ':' + ticker;
      if (buyMap.has(buyKey)) {
        buySignals.push({ x: row.Date, y: buyMap.get(buyKey), ticker: ticker, borderColor: tickerColor });
      }
      if (sellMap.has(sellKey)) {
        sellSignals.push({ x: row.Date, y: sellMap.get(sellKey), ticker: ticker, borderColor: tickerColor });
      }
    });
  });

  const ctx = document.getElementById('priceChart');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: datasets.concat([
        {
          label: 'Buy Signals',
          data: buySignals.map(point => ({ x: point.x, y: point.y })),
          borderColor: '#22c55e',
          backgroundColor: '#22c55e',
          pointRadius: 5,
          pointStyle: 'circle',
          showLine: false
        },
        {
          label: 'Sell Signals',
          data: sellSignals.map(point => ({ x: point.x, y: point.y })),
          borderColor: '#ef4444',
          backgroundColor: '#ef4444',
          pointRadius: 5,
          pointStyle: 'circle',
          showLine: false
        }
      ])
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        legend: {
          position: 'top'
        }
      },
      scales: {
        x: {
          type: 'category',
          ticks: {
            maxTicksLimit: 12,
            autoSkip: true
          }
        },
        y: {
          beginAtZero: false,
          title: {
            display: true,
            text: 'Price ($)'
          }
        }
      }
    }
  });
</script>
{% endblock %}
